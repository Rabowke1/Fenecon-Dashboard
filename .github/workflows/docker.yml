name: Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fenecon-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest test_server test_exports test_tariff

      - name: Image bauen und im Demo-Modus testen
        run: |
          docker build -t fenecon-dashboard:test .
          docker run -d --name smoke -p 8080:8080 -e FEMS_DEMO=true fenecon-dashboard:test
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/api/live | grep -q '"ok": true' && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8080/api/live
          curl -fs http://127.0.0.1:8080/ | grep -q "PV-Anlage"
          docker logs smoke
          docker rm -f smoke

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Image für amd64 und arm64 bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
